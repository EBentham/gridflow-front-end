name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Runs on main publish, so a newer one cancels the one before it, checks and all: an older commit
# whose checks finish late can never deploy over a newer one. Every other run (pull requests,
# manual runs on other branches) gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  docs-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Makes the previously local-only merge gate (idempotent render across
      # all vendor pages) mechanical on every PR, not just at deploy time. It also
      # fails when the vault mirror's sync stamp is missing or malformed.
      - name: Verify build idempotence (CI-03)
        run: uv run --extra build gridflow-build --check

      # The distil extra brings Polars, so the tests that read parquet run instead of skipping.
      - name: Run tests
        run: uv run --extra build --extra distil pytest -x -q

  # Publishes only after every check above has passed: on a push to main, or a manual run.
  deploy:
    needs: docs-integrity
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      # --check renders every page, then renders again and compares, so it is also the build
      # that gets published.
      - name: Render dataset pages and verify idempotence (CI-03)
        run: gridflow-build --check

      - name: Install htmlhint (CI-01)
        run: npm install -g htmlhint
      - name: Run htmlhint
        run: htmlhint --config .htmlhintrc 'site/hifi/**/*.html'

      - name: Validate internal links (CI-02)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --offline
            --include-fragments
            './site/hifi/**/*.html'
          fail: true
          format: detailed

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/hifi

      - id: deployment
        uses: actions/deploy-pages@v4
