<style>
body{margin:0}
.root{background:#155A6E;color:#1C2B22;font:400 16px/1.6 "Hanken Grotesk",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.root a{color:inherit;text-decoration-thickness:1.5px;text-underline-offset:4px;text-decoration-color:#66793B}
.root a:focus-visible{outline:2px solid #AFC64E;outline-offset:3px;border-radius:2px}
.root h1,.root h2,.root h3{font-family:"Bricolage Grotesque",sans-serif;margin:0;font-optical-sizing:auto}
.root code{font-family:"Red Hat Mono",monospace;font-size:.9em}
.layer{position:absolute;left:0;top:0}
main{position:relative;display:block}
.st{position:relative;box-sizing:border-box;padding:0 80px}
.sky{position:relative;box-sizing:border-box;padding:0 80px}
.mast{display:flex;justify-content:space-between;align-items:baseline;padding-top:26px;color:#F6F4EC;line-height:1.6}
.brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:24px;letter-spacing:-.01em}
.root .brand{text-decoration:none}
.mast ul{display:flex;gap:30px;list-style:none;margin:0;padding:0;font-size:15px}
.mast ul a{text-decoration:none;color:#CFE0DC}
.mast ul a:hover{color:#F6F4EC}
.mast ul a[aria-current="page"]{color:#F6F4EC;box-shadow:inset 0 -2px 0 #AFC64E}
.hero{display:grid;grid-template-columns:860px 374px;column-gap:46px;margin-top:64px;align-items:start}
.hero h1{color:#F6F4EC;font-weight:760;font-stretch:84%;font-size:86px;line-height:.94;letter-spacing:-.022em}
.crumb{margin:0 0 18px;font-size:15px;line-height:1.4;color:#B4D0CD}
.crumb a{color:#CFE0DC;text-decoration-color:#AFC64E}
.lede{padding-top:14px}
.lede p{margin:0 0 14px;font-size:17.5px;line-height:1.6;color:#CFE0DC;max-width:58ch}
.lede p.lead{color:#F6F4EC}
.lede .n{color:#F6F4EC;font-weight:600}
.lede code{color:#F6F4EC;font-size:.86em}
.alt{font-weight:600;color:#F6F4EC;text-decoration-color:#AFC64E}
.root .alt{text-decoration-color:#AFC64E}
.facts{margin:4px 0 0}
.facts div{display:grid;grid-template-columns:96px minmax(0,1fr);column-gap:14px;padding:7px 0;border-top:1px solid rgba(207,224,220,.22)}
.facts dt{font-size:14px;line-height:1.45;color:#B4D0CD}
.facts dd{margin:0;font-size:14.5px;line-height:1.45;color:#F6F4EC}
.facts code{font-size:13.5px}
.land-svg text,.lab text{font-family:"Hanken Grotesk",sans-serif;font-style:italic;font-size:13.5px}
.sec h2,.st h2.big{font-size:42px;font-weight:720;font-stretch:88%;line-height:1.02;letter-spacing:-.018em;margin:0 0 16px}
.st h2.fig-h{font-size:30px;font-weight:700;font-stretch:90%;line-height:1.1;letter-spacing:-.012em;margin:0 0 8px}
.sec p,.st p.body{margin:0 0 14px;font-size:16px;line-height:1.62;color:#3F4A3B;max-width:58ch}
.st p code,.st li code,.st dd code{color:#1C2B22}
.cap{margin:8px 0 0;font-size:14.5px;line-height:1.55;color:#3F4A3B;max-width:66ch}
.more{font-weight:600;color:#1C2B22}
.chart{display:block;overflow:visible}
.chart text{font-family:"Hanken Grotesk",sans-serif;font-size:13px;fill:#3F4A3B}
.chart text.dl{font-style:italic;font-size:13.5px;fill:#1C2B22}
.well{margin:0;background:#ECE8DA;border:1px solid rgba(28,43,34,.18);border-radius:3px;padding:10px 14px;font:400 14.5px/1.7 "Red Hat Mono",monospace;color:#1C2B22;white-space:pre;overflow:hidden}
.well .s{color:#7C5530}
.well .k{color:#155A6E;font-weight:500}
.well .c{color:#5d6a55}
.st-deep{color:#F6F4EC}
.foot{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;column-gap:40px;padding:44px 0 56px;border-top:1px solid rgba(207,224,220,.22)}
.foot ul{display:flex;gap:28px;list-style:none;margin:0;padding:0;font-size:15px}
.foot ul a{color:#CFE0DC;text-decoration:none}
.foot ul a:hover{color:#F6F4EC;text-decoration:underline;text-decoration-color:#AFC64E}
.foot p{grid-column:1 / -1;margin:14px 0 0;font-size:14px;color:#B4D0CD}
.rot{transform-box:fill-box;transform-origin:center;animation:spin 17s linear infinite}
.sp2{animation-duration:13s}
.sp3{animation-duration:21s}
@keyframes spin{to{transform:rotate(360deg)} }
@media (prefers-reduced-motion: reduce){.rot{animation:none} }
.sky{position:relative;box-sizing:border-box;padding:0 80px 40px;background:#155A6E}
.hero{display:grid;grid-template-columns:780px 440px;column-gap:60px;margin-top:64px;align-items:start}
.lede{padding-top:10px}
.lede .repo{margin-top:22px;color:#F6F4EC}
.lede .repo code{font-size:15px}
.ground{position:relative;background:#155A6E}
.gnd,.flow,.trail{position:absolute;left:0;top:0;display:block;overflow:visible}
.gnd{z-index:0}
.flow{z-index:1}
.trail{z-index:3;pointer-events:none}
.gin{position:relative;z-index:2;padding:370px 80px 0}
.flow .lab text{font-family:"Hanken Grotesk",sans-serif;font-style:italic;font-size:14px;fill:#1C2B22}
.flow .lab text.m{font-family:"Red Hat Mono",monospace;font-style:normal;font-size:13px}
.flow .lab text.hs{paint-order:stroke;stroke:#DCE2DF;stroke-width:5px;stroke-linejoin:round}
.flow .lab text.ht{paint-order:stroke;stroke:#ECE8DA;stroke-width:5px;stroke-linejoin:round}
.root h2{font-size:42px;font-weight:720;font-stretch:88%;line-height:1.02;letter-spacing:-.018em;color:#1C2B22}
.root h3{font-size:23px;font-weight:720;font-stretch:90%;line-height:1.1;letter-spacing:-.005em;color:#1C2B22;margin:0 0 8px}
.thead{display:grid;grid-template-columns:520px 560px;column-gap:80px;align-items:end}
.thead p,.built p,.re p{margin:0;font-size:16px;line-height:1.62;color:#3F4A3B;max-width:58ch}
.step{margin:0;display:grid;column-gap:40px;align-items:start}
.step.s1{margin-top:64px;grid-template-columns:1003px minmax(0,1fr)}
.step.s2{margin-top:84px;grid-template-columns:minmax(0,1fr) 883px}
.step.s3{margin-top:84px;grid-template-columns:963px minmax(0,1fr)}
.scap{padding-top:66px;max-width:320px}
.s2 .scap{padding-top:76px;max-width:340px}
.scap h3{margin-top:14px}
.scap p{margin:0;font-size:15px;line-height:1.55;color:#3F4A3B}
.scap p.open{margin-top:10px;font-size:14px}
.scap .open a{color:#1C2B22;font-weight:600}
.open .dk{display:none}
.jn{display:block;box-sizing:content-box;width:24px;height:24px;border:2px solid #1C2B22;border-radius:50%;background:#F6F4EC;font:700 13px/24px "Hanken Grotesk",sans-serif;text-align:center;color:#1C2B22;font-variant-numeric:tabular-nums}
.win{box-sizing:content-box;border:1.5px solid #1C2B22;border-radius:4px;overflow:hidden;background:#F6F4EC}
.wbar{display:flex;justify-content:space-between;align-items:flex-end;height:40px;background:#1C2B22;padding:0 18px 0 12px}
.wtab{background:#F6F4EC;color:#1C2B22;padding:11px 18px 12px;border-radius:3px 3px 0 0;font:600 14px/1 "Hanken Grotesk",sans-serif;white-space:nowrap}
.wname{align-self:center;color:#CFE0DC;font:400 13.5px/1 "Red Hat Mono",monospace;white-space:nowrap}
.wbody{position:relative;overflow:hidden}
.wbody picture{display:block}
.wbody img{position:absolute;display:block;max-width:none}
.ring{position:absolute;box-sizing:border-box;border:3px solid #AFC64E;outline:1.5px solid #1C2B22;border-radius:5px}
.built{margin-top:120px}
.built h2{margin:0 0 30px}
.bcol{width:660px}
.fe p+p{margin-top:12px}
.be{margin-top:120px}
.wt{margin:22px 0 8px;font-size:13.5px;line-height:1.4;color:#3F4A3B}
.wt code{font-size:12.5px;color:#1C2B22}
.root .well{font-size:13px;line-height:1.7;overflow-x:auto;scrollbar-width:none}
.built p code{color:#1C2B22}
.bspace{height:0}
.rest{display:grid;grid-template-columns:420px minmax(0,1fr) minmax(0,1fr);column-gap:60px;align-items:start;padding-bottom:110px}
.rest h2{margin:0}
.re h3{margin:4px 0 8px}
.re h3 a{text-decoration-color:#66793B}
.deep{position:relative;background:#155A6E;color:#F6F4EC;margin-top:-2px}
.deep .gran{position:absolute;left:0;top:0;z-index:0}
.deep>*:not(.gran){position:relative;z-index:1}
.redge{display:block}
.foot{border-top:0}
@media (prefers-color-scheme: dark){
.wtab{background:transparent;color:#F6F4EC;box-shadow:inset 0 -2px 0 #AFC64E}
.open .lt{display:none}
.open .dk{display:inline}
}
.gin{padding:70px 80px 96px}
.nw{white-space:nowrap}
.root .built{margin-top:0}
.built h2{margin:0 0 30px}
.flow .lab text.hg{paint-order:stroke;stroke:#E9DDAF;stroke-width:5px;stroke-linejoin:round}
.flow .lab tspan.m{font-family:"Red Hat Mono",monospace;font-style:normal;font-size:13px}
.va .bcol{width:520px}
.va .fe p,.va .be p{font-size:17.5px;line-height:1.55;color:#3F4A3B;max-width:40ch}
.va .be{margin-top:170px}
.does{list-style:none;margin:0;padding:0;width:560px}
.does li{margin:0}
.does li+li{margin-top:150px}
.does li:nth-child(3){margin-top:230px}
.does p{margin:0;font-size:19px;line-height:1.45;color:#1C2B22;max-width:38ch}
.does .tech{color:#3F4A3B}
.vc .dslot{height:0}
.vc h2{margin-bottom:0}
.cpara{margin:0;font-size:17.5px;line-height:1.6;color:#3F4A3B;max-width:58ch}
</style>
